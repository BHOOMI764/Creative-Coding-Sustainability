services:
  - type: web
    name: creative-coding-server
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:database.db
      - key: JWT_SECRET
        scope: SECRET
      - key: CORS_ORIGIN
        scope: SECRET
      - key: SESSION_SECRET
        scope: SECRET
